<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سُفرة – مطعم مصري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<style>
:root{--bg:#f6f8f7;--surface:#fff;--ink:#12263a;--mute:#5d6f7e;--line:#dfe6e4;--brand:#0e7c7b;--brand-ink:#fff;--sun:#f2b705;--hot:#d9482b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--surface:#162532;--ink:#eef3f2;--mute:#9bb0bd;--line:#26394a;--brand:#2bb3b0;--brand-ink:#06201f;--sun:#f2b705;--hot:#ff7a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a24;--surface:#162532;--ink:#eef3f2;--mute:#9bb0bd;--line:#26394a;--brand:#2bb3b0;--brand-ink:#06201f;--sun:#f2b705;--hot:#ff7a5c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--brand);color:var(--brand-ink);padding:28px 18px 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:var(--sun);opacity:.9}
.hero>*{position:relative;z-index:1;max-width:760px;margin-inline:auto}
.hero h1{font-size:clamp(2.6rem,10vw,4.6rem);font-weight:900;margin:0;line-height:1.1}
.hero p{margin:8px 0 14px;font-size:1.05rem;max-width:30ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem;font-weight:600}
.meta span{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px}
.theme{position:absolute!important;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);font-size:1.1rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.tabs button{flex:none;padding:7px 16px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;background:var(--surface);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:6px 14px 130px}
h2{font-size:1.5rem;font-weight:800;margin:26px 0 4px}
.sub{color:var(--mute);margin:0 0 10px;font-size:.9rem}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.emo{flex:none;width:58px;height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1.9rem}
.info{flex:1;min-width:0}
.info b{font-weight:700;display:block}
.info small{color:var(--mute);display:block;font-size:.82rem;line-height:1.4}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sun);color:#12263a;margin-inline-start:6px}
.tag.hot{background:var(--hot);color:#fff}
.price{font-weight:800;color:var(--brand);margin-top:2px}
.add{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:8px 16px;font-weight:700}
.step{display:flex;align-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--brand);border-radius:12px}
.step button{width:34px;height:36px;font-size:1.2rem;font-weight:800;color:var(--brand)}
.step span{min-width:22px;text-align:center;font-weight:800}
.bar{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;max-width:736px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);width:auto}
.bar[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8;display:none}
.ov.on{display:block}
.sheet{position:fixed;z-index:9;inset-inline:0;bottom:0;max-height:92%;max-width:560px;margin-inline:auto;background:var(--bg);border-radius:22px 22px 0 0;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sh h3{margin:0;font-size:1.3rem;font-weight:800}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.sb{overflow-y:auto;padding:0 18px 12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row.t{border:0;padding:4px 0;color:var(--mute);font-size:.92rem}
.row.g{border:0;font-size:1.2rem;font-weight:900;padding-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg button{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.err{color:var(--hot);font-size:.82rem;min-height:1.1em}
.cta{margin:8px 18px 14px;padding:14px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:1.05rem;width:calc(100% - 36px)}
.cta:disabled{opacity:.5}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:3.4rem}
.empty{text-align:center;color:var(--mute);padding:30px 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
  <button class="theme" id="theme" aria-label="تغيير الوضع">🌓</button>
  <h1>سُفرة</h1>
  <p>أكل مصري زي ما أمك بتعمله، بس بيوصلك لحد الباب.</p>
  <div class="meta"><span>🕙 من ١٠ ص لـ ٢ ص</span><span>🛵 توصيل ٣٠–٤٥ دقيقة</span><span>📍 الدقي، الجيزة</span></div>
</header>
<nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
<main id="menu"></main>
<button class="bar" id="bar" hidden><span id="barQ"></span><span>عرض السلة</span><span id="barT"></span></button>
<div class="ov" id="ov"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="السلة"></section>

<script>
// ⚠️ غيّر الرقم ده برقم واتساب المطعم: 20 + الرقم من غير الصفر الأول (مثال: 201012345678)
var WA_NUMBER="201090813285";
var CATS=[["bk","الفطار 🍳","فول وطعمية على أصولها"],["mn","الأطباق الرئيسية 🍲","أكل بيت متسبّك"],["gr","المشويات 🔥","على الفحم"],["sw","السندوتشات 🥙","لقمة سريعة"],["sd","المقبلات والسلطات 🥗","جنب أي أكلة"],["ds","الحلويات 🍮","ختام حلو"],["dr","المشروبات 🥤","بارد وسخن"]];
// [قسم, اسم, وصف, سعر, إيموجي, شارة]
var ITEMS=[
["bk","فول بالزيت الحار","فول مدمس بالليمون والكمون وزيت حار","35","🫘",""],
["bk","فول إسكندراني","بالطماطم والفلفل والثوم","45","🫘","الأكثر طلباً"],
["bk","طعمية (٥ أقراص)","فول أخضر ومقرمشة من بره","30","🧆",""],
["bk","بيض بالبسطرمة","بيض مقلي مع بسطرمة وجبنة","85","🍳",""],
["bk","جبنة قديمة بالطماطم","مع عيش بلدي سخن","55","🧀",""],
["bk","شكشوكة","بيض في صلصة طماطم حارة","75","🍳","حار"],
["mn","كشري مصري","أرز ومكرونة وعدس وحمص وتقلية وصلصة","60","🍝","الأكثر طلباً"],
["mn","ملوخية بالفراخ","مع أرز أبيض وربع فرخة","130","🥬",""],
["mn","محشي ورق عنب","نصف كيلو بالتقلية","150","🌿",""],
["mn","ممبار مشوي","محشي أرز وبهارات، مع سلطة","120","🥘",""],
["mn","فتة لحمة","فتة بالثوم والخل ولحمة ضاني","190","🍖",""],
["mn","طاجن بامية باللحم","في الفرن بصلصة الطماطم","175","🍲",""],
["mn","مسقعة بالباذنجان","بالطماطم والفلفل الرومي","70","🍆",""],
["mn","حمام محشي فريك","حمامة كاملة محشية","210","🕊️","جديد"],
["gr","كباب مشوي","نصف كيلو مع عيش وسلطات","420","🍢",""],
["gr","كفتة مشوية","نصف كيلو بالبقدونس والبصل","360","🍢","الأكثر طلباً"],
["gr","ريش ضاني","نصف كيلو متبلة بالروزماري","520","🥩",""],
["gr","نص فرخة مشوية","متبلة بالليمون والثوم","150","🍗",""],
["gr","طاووق","أسياخ فراخ متبلة بالزبادي","140","🍢",""],
["gr","ميكس جريل (لفردين)","كباب وكفتة وطاووق وأرز","480","🔥","جديد"],
["sw","سندوتش فول","عيش بلدي بالطحينة","20","🥙",""],
["sw","سندوتش طعمية","بالسلطة والباذنجان المخلل","18","🥙",""],
["sw","كبدة إسكندراني","بالفلفل الحار والثوم","70","🥙","حار"],
["sw","حواوشي","عيش مشوي محشي لحمة مفرومة","75","🥙",""],
["sw","شاورما فراخ","بالثومية والمخلل","85","🌯",""],
["sw","سجق","بالفلفل الألوان","70","🌭",""],
["sd","سلطة بلدي","خيار وطماطم وجرجير","30","🥗",""],
["sd","سلطة طحينة","تحميصة ومعلقة طحينة","25","🥣",""],
["sd","بابا غنوج","باذنجان مشوي بالطحينة","40","🍆",""],
["sd","بطاطس محمرة","مقرمشة مع كاتشب","40","🍟",""],
["sd","مخلل مشكل","خيار وليمون وجزر","20","🥒",""],
["ds","أم علي","بالمكسرات والقشطة من الفرن","65","🍮","الأكثر طلباً"],
["ds","كنافة بالقشطة","سخنة وعليها قطر","70","🥮",""],
["ds","رز بلبن","بالقرفة والفانيليا","40","🍚",""],
["ds","بسبوسة بالقشطة","قطعة كبيرة","45","🍰",""],
["ds","مهلبية","بماء الورد والفستق","35","🥛",""],
["dr","شاي بالنعناع","كوباية","20","🍵",""],
["dr","قهوة تركي","سادة أو مظبوط أو زيادة","35","☕",""],
["dr","عصير قصب","طازج بالتلج","40","🧃",""],
["dr","سوبيا","بالحليب وجوز الهند","35","🥛",""],
["dr","كركديه","بارد أو ساخن","30","🍹",""],
["dr","عرقسوس","بالتلج","25","🥤",""],
["dr","ليمون بالنعناع","مثلج ومنعش","40","🍋",""]
].map(function(a,i){return{id:i,cat:a[0],name:a[1],desc:a[2],price:+a[3],emo:a[4],tag:a[5]}});

var cart={},mode="delivery",view="cart",lastOrder="",lastLink="";
try{var s=localStorage.getItem("sofra-cart");if(s)cart=JSON.parse(s)||{}}catch(e){}
function save(){try{localStorage.setItem("sofra-cart",JSON.stringify(cart))}catch(e){}}
function egp(n){return n.toLocaleString("ar-EG",{maximumFractionDigits:2})+" ج.م"}
function $(i){return document.getElementById(i)}
function qty(){return Object.values(cart).reduce(function(a,b){return a+b},0)}
function calc(){var sub=0;ITEMS.forEach(function(i){sub+=(cart[i.id]||0)*i.price});
  var sv=Math.round(sub*.12*100)/100,vat=Math.round(sub*.14*100)/100,dl=mode==="delivery"&&sub>0&&sub<400?25:0;
  return{sub:sub,sv:sv,vat:vat,dl:dl,total:sub+sv+vat+dl}}

function drawMenu(){
  $("tabs").innerHTML=CATS.map(function(c,i){return '<button data-go="'+c[0]+'" aria-pressed="'+(i===0)+'">'+c[1]+'</button>'}).join("");
  $("menu").innerHTML=CATS.map(function(c){
    return '<section id="sec-'+c[0]+'"><h2>'+c[1]+'</h2><p class="sub">'+c[2]+'</p>'+
    ITEMS.filter(function(i){return i.cat===c[0]}).map(function(i){
      return '<div class="item"><div class="emo" aria-hidden="true">'+i.emo+'</div><div class="info"><b>'+i.name+
      (i.tag?'<span class="tag'+(i.tag==="حار"?' hot':'')+'">'+i.tag+'</span>':'')+'</b><small>'+i.desc+'</small><div class="price">'+egp(i.price)+'</div></div><div id="c'+i.id+'"></div></div>'}).join("")+'</section>'}).join("");
  ITEMS.forEach(function(i){ctl(i.id)});
}
function ctl(id){var n=cart[id]||0,el=$("c"+id);if(!el)return;
  el.innerHTML=n?'<div class="step"><button data-p="'+id+'" aria-label="زيادة">+</button><span>'+n.toLocaleString("ar-EG")+'</span><button data-m="'+id+'" aria-label="نقص">−</button></div>':'<button class="add" data-p="'+id+'">أضف</button>'}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];save();ctl(id);bar();if($("sheet").classList.contains("on"))drawSheet()}
function bar(){var q=qty(),b=$("bar");b.hidden=!q;if(q){$("barQ").textContent=q.toLocaleString("ar-EG")+" صنف";$("barT").textContent=egp(calc().sub)}}

function open(v){view=v;$("ov").classList.add("on");$("sheet").classList.add("on");drawSheet()}
function close(){$("ov").classList.remove("on");$("sheet").classList.remove("on")}
function totals(){var t=calc();return '<div class="row t"><span>المجموع</span><span>'+egp(t.sub)+'</span></div><div class="row t"><span>خدمة ١٢٪</span><span>'+egp(t.sv)+'</span></div><div class="row t"><span>ضريبة قيمة مضافة ١٤٪</span><span>'+egp(t.vat)+'</span></div>'+
  (mode==="delivery"?'<div class="row t"><span>التوصيل (مجاني فوق ٤٠٠ ج.م)</span><span>'+(t.dl?egp(t.dl):"مجاني")+'</span></div>':'')+'<div class="row g"><span>الإجمالي</span><span>'+egp(t.total)+'</span></div>'}
function head(t,back){return '<div class="sh"><h3>'+t+'</h3><button class="x" data-close aria-label="إغلاق">✕</button></div>'}
function drawSheet(){var h="",q=qty();
  if(view==="done"){$("sheet").innerHTML=head("خلّصنا تقريباً")+'<div class="done"><div class="big">💬</div><h3>طلبك جاهز يتبعت على واتساب</h3><p>رقم الطلب <b>'+lastOrder+'</b><br>لو واتساب مفتحش لوحده اضغط الزرار وابعت الرسالة.</p></div><a class="cta" style="display:block;text-align:center;text-decoration:none" href="'+lastLink+'" target="_blank" rel="noopener">فتح واتساب وإرسال الطلب</a>';return}
  if(!q){$("sheet").innerHTML=head("السلة")+'<div class="empty">السلة فاضية، ضيف أصناف من المنيو.</div>';return}
  if(view==="cart"){
    h=head("سلتك")+'<div class="sb">'+ITEMS.filter(function(i){return cart[i.id]}).map(function(i){return '<div class="row"><div class="info"><b>'+i.name+'</b><div class="price">'+egp(i.price*cart[i.id])+'</div></div><div class="step"><button data-p="'+i.id+'" aria-label="زيادة">+</button><span>'+cart[i.id].toLocaleString("ar-EG")+'</span><button data-m="'+i.id+'" aria-label="نقص">−</button></div></div>'}).join("")+
    '<div class="seg"><button data-mode="delivery" aria-pressed="'+(mode==="delivery")+'">🛵 توصيل</button><button data-mode="pickup" aria-pressed="'+(mode==="pickup")+'">🏪 استلام من الفرع</button></div>'+totals()+'</div><button class="cta" data-go-co>كمّل الطلب</button>'}
  else{h=head("بيانات الطلب")+'<div class="sb"><label for="fn">الاسم</label><input id="fn" autocomplete="name"><div class="err" id="e1"></div><label for="fp">رقم الموبايل</label><input id="fp" inputmode="numeric" placeholder="01xxxxxxxxx" autocomplete="tel"><div class="err" id="e2"></div>'+
    (mode==="delivery"?'<label for="fa">العنوان بالتفصيل</label><input id="fa" autocomplete="street-address"><div class="err" id="e3"></div>':'')+
    '<div class="row t" style="margin-top:8px"><span>الدفع</span><span>كاش عند الاستلام 💵</span></div>'+totals()+'</div><button class="cta" data-send>إرسال الطلب على واتساب</button>'}
  $("sheet").innerHTML=h}

function send(){var n=$("fn").value.trim(),p=$("fp").value.trim(),a=mode==="delivery"?$("fa").value.trim():"x",ok=true;
  $("e1").textContent=n.length<3?(ok=false,"اكتب اسمك"):"";
  $("e2").textContent=/^01[0125]\d{8}$/.test(p)?"":(ok=false,"اكتب رقم موبايل مصري صحيح من ١١ رقم");
  if(mode==="delivery")$("e3").textContent=a.length<8?(ok=false,"اكتب عنوان واضح"):"";
  if(!ok)return;
  lastOrder="#"+(1000+Math.floor(Math.random()*9000)).toLocaleString("ar-EG",{useGrouping:false});
  var t=calc(),L=["*طلب جديد من سُفرة* "+lastOrder,"",ITEMS.filter(function(i){return cart[i.id]}).map(function(i){return "• "+i.name+" × "+cart[i.id]+" = "+i.price*cart[i.id]+" ج.م"}).join("\n"),"",
   "المجموع: "+t.sub+" ج.م","خدمة 12%: "+t.sv+" ج.م","ضريبة 14%: "+t.vat+" ج.م",mode==="delivery"?"التوصيل: "+(t.dl?t.dl+" ج.م":"مجاني"):"استلام من الفرع","*الإجمالي: "+t.total+" ج.م* (كاش عند الاستلام)","",
   "الاسم: "+n,"الموبايل: "+p,mode==="delivery"?"العنوان: "+a:"استلام من الفرع"];
  lastLink="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(L.join("\n"));
  cart={};save();drawMenu();bar();view="done";drawSheet();
  try{window.open(lastLink,"_blank")}catch(e){}}

document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.dataset.p!==undefined)change(+t.dataset.p,1);
  else if(t.dataset.m!==undefined)change(+t.dataset.m,-1);
  else if(t.dataset.go){var s=$("sec-"+t.dataset.go);if(s)s.scrollIntoView();document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-pressed",b===t)})}
  else if(t.id==="bar")open("cart");
  else if(t.hasAttribute("data-close"))close();
  else if(t.dataset.mode){mode=t.dataset.mode;drawSheet()}
  else if(t.hasAttribute("data-go-co")){view="co";drawSheet()}
  else if(t.hasAttribute("data-send"))send();
  else if(t.id==="theme"){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}
});
$("ov").addEventListener("click",close);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
drawMenu();bar();
</script>
</body>
</html>
